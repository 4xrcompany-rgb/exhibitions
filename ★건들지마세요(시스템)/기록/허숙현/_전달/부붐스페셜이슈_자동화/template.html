<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
/* 관리 데이터 */

/* 공통 경로 */
var IMG_BASE = "{{IMG_BASE}}";
var GOODS_URL = "/shop/view.php?index_no=";
var BRAND_URL = "/shop/brand_goods.php?brand={{BRAND_ID}}";

/* 자리별 이미지 · 상품번호 · 상품명
   slot  = 화면 자리 (HTML 의 data-slot 과 같은 값)
           slot 이 pd_ 로 시작하면 상품 영역(pd_stage) 안에 순서대로 만들어진다
   file  = IMG_BASE 뒤에 붙는 파일 경로
   goods = 상품번호 (새 창으로 열림 / 비워 두면 링크도 상품 정보도 안 나온다)
   name  = 상품명
   slides = file/goods/name 을 여러 개 적으면 그 자리는 자동 스와이프가 된다
   ※ 가격은 적지 않는다. 최종가와 할인율은 몰에서 실시간으로 읽어 온다 */
{{ITEMS}}

/* 페이드 효과를 넣지 않을 자리 */
var NO_FADE = ["visual"];

/* 끌어 옮길 수 있는 자리 (콜라주로 겹쳐 있는 칸) */
var MOVABLE = ["pd_04_01", "pd_04_02", "pd_04_03", "pd_04_04", "pd_04_05"];

/* 자동 스와이프 넘어가는 간격 (1000 = 1초) */
var SLIDE_TIME = 2200;

/* 사진 위 상품 정보 */
var TIP_WAIT = 120;
var TIP_STAY = 3000;

(function () {
    var i, j, it, box, tip;
    var TIPS = [], PCACHE = {}, topZ = 10, held = null;

    function noop() {}
    function newWin(el, href) {
        el.href = href;
        el.target = "_blank";
        el.rel = "noopener";
    }

    /* 끌어 옮기기 */
    document.addEventListener("mousemove", function (e) { if (held) held.move(e.clientX, e.clientY); });
    document.addEventListener("mouseup", function () { if (held) held.finish(); });

    function makeMovable(box) {
        var sx = 0, sy = 0, ox = 0, oy = 0, dx = 0, dy = 0, dist = 0, wait = null;
        function grab(on) { box.className = box.className.replace(" grabbing", "") + (on ? " grabbing" : ""); }
        var me = {
            move: function (x, y) {
                dx = ox + (x - sx);
                dy = oy + (y - sy);
                dist = Math.abs(x - sx) + Math.abs(y - sy);
                box.style.transform = "translate(" + dx + "px, " + dy + "px)";
            },
            finish: function () {
                held = null;
                box.dragging = false;
                grab(false);
                if (wait) { clearTimeout(wait); wait = null; }
            }
        };
        box.className += " movable";

        function front() { box.style.zIndex = ++topZ; }
        function begin(x, y) {
            sx = x; sy = y; ox = dx; oy = dy; dist = 0;
            held = me;
            box.dragging = true;
            grab(true);
        }

        box.addEventListener("mousedown", function (e) {
            if (e.button) return;
            e.preventDefault();
            front();
            begin(e.clientX, e.clientY);
        });
        box.addEventListener("touchstart", function (e) {
            var t = e.touches[0];
            front();
            if (wait) clearTimeout(wait);
            wait = setTimeout(function () { begin(t.clientX, t.clientY); }, 250);
        });
        box.addEventListener("touchmove", function (e) {
            if (held !== me) {
                if (wait) { clearTimeout(wait); wait = null; }
                return;
            }
            if (e.cancelable) e.preventDefault();
            me.move(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
        box.addEventListener("touchend", me.finish);
        box.addEventListener("touchcancel", me.finish);
        box.addEventListener("click", function (e) {
            if (dist > 8) { e.preventDefault(); e.stopPropagation(); dist = 0; }
        }, true);
    }

    var stage = document.querySelector("#pd_section .pd_stage");
    for (i = 0; stage && i < ITEMS.length; i++) {
        if (ITEMS[i].slot.indexOf("pd_") !== 0) continue;
        box = document.createElement("div");
        box.className = "pd_item photo " + ITEMS[i].slot;
        box.setAttribute("data-slot", ITEMS[i].slot);
        stage.appendChild(box);
        if (MOVABLE.indexOf(ITEMS[i].slot) >= 0) makeMovable(box);
    }

    function makePhoto(s) {
        var im = document.createElement("img"), a;
        im.src = IMG_BASE + s.file;
        im.alt = s.name;
        if (!s.goods) return im;
        a = document.createElement("a");
        newWin(a, GOODS_URL + s.goods);
        a.appendChild(im);
        return a;
    }

    /* 가격 */
    function readPrice(root, sel) {
        var box = root.querySelector(sel), sale, now, off, v;
        if (!box) return null;
        sale = box.querySelector(".sale");
        now = box.querySelector(".current_price") || box.querySelector(".btn_price strong") ||
              box.querySelector("strong.price") || box.querySelector(".price") || box.querySelector(".ori_price");
        off = sale ? sale.textContent.replace(/\s/g, "") : "";
        v = now ? now.textContent : "";
        if (off) v = v.replace(off, "");
        v = v.replace(/[^0-9,]/g, "");
        return v ? { now: v + "원", off: (off === "0%" ? "" : off) } : null;
    }

    function inThisPage(no) {
        var re = new RegExp("index_no=" + no + "(?![0-9])");
        var list = document.querySelectorAll(".product"), k, a;
        for (k = 0; k < list.length; k++) {
            a = list[k].querySelector('a[href*="index_no="]');
            if (a && re.test(a.getAttribute("href"))) return readPrice(list[k], ".price_box");
        }
        return null;
    }

    function getPrice(no, done, tries) {
        var got = inThisPage(no), x;
        if (got) { PCACHE[no] = { val: got }; done(got); return; }
        if (PCACHE[no]) {
            if (PCACHE[no].wait) PCACHE[no].wait.push(done);
            else done(PCACHE[no].val);
            return;
        }
        tries = tries || 0;
        if (tries < 6) {
            setTimeout(function () { getPrice(no, done, tries + 1); }, 400);
            return;
        }
        PCACHE[no] = { wait: [done] };
        x = new XMLHttpRequest();
        x.open("GET", GOODS_URL + no, true);
        x.onreadystatechange = function () {
            if (x.readyState !== 4) return;
            var val = null, w, k;
            if (x.status === 200 && window.DOMParser) {
                val = readPrice(new DOMParser().parseFromString(x.responseText, "text/html"), ".price_02");
            }
            w = PCACHE[no].wait;
            PCACHE[no] = { val: val };
            for (k = 0; k < w.length; k++) w[k](val);
        };
        x.send();
    }

    /* 사진 위 상품 정보 */
    function makeTip(box, first) {
        var tip = document.createElement("a"), nm = document.createElement("span"),
            pr = document.createElement("span"), now = document.createElement("span"),
            cut = document.createElement("span"), btn = document.createElement("button");
        var open = false, shown = false, ready = false, off = null, cur = "";
        nm.className = "tip_nm";
        pr.className = "tip_pr";
        cut.className = "tip_off";
        cut.style.display = "none";
        pr.appendChild(now);
        pr.appendChild(cut);
        tip.appendChild(nm);
        tip.appendChild(pr);
        btn.type = "button";
        btn.setAttribute("aria-label", "상품 정보 보기");
        box.appendChild(tip);
        box.appendChild(btn);

        function size() {
            var w = box.offsetWidth, k = (w < 300 ? " sm" : (w < 600 ? " md" : ""));
            tip.className = "tip" + k + (open ? " on" : "");
            btn.className = "tip_btn" + k + (shown ? " show" : "") + (open ? " open" : "");
        }
        function set(s) {
            nm.textContent = s.name;
            now.textContent = "";
            cut.textContent = "";
            cut.style.display = "none";
            newWin(tip, GOODS_URL + s.goods);
            cur = s.goods;
            getPrice(s.goods, function (v) {
                if (cur !== s.goods) return;
                ready = true;
                if (!v) return;
                now.textContent = v.now;
                if (v.off) { cut.textContent = v.off; cut.style.display = ""; }
            });
        }
        btn.onclick = function () {
            if (off) { clearTimeout(off); off = null; }
            open = !open;
            size();
        };
        set(first);
        size();
        TIPS.push(size);

        return {
            set: set,
            auto: function () {
                var t0 = new Date().getTime();
                (function waitPrice() {
                    if (!ready && new Date().getTime() - t0 < 1200) { setTimeout(waitPrice, 150); return; }
                    setTimeout(function () { shown = true; open = true; size(); }, TIP_WAIT);
                    off = setTimeout(function () { open = false; off = null; size(); }, TIP_WAIT + TIP_STAY);
                })();
            }
        };
    }

    /* 자동 스와이프 */
    function makeSlider(box, list, onMove) {
        var track = document.createElement("div"), dots = document.createElement("div");
        var now = 0, timer = null, startX = null, moved = 0, touched = false, btns = [], n, sl, dot;
        track.className = "slide_track";
        dots.className = "slide_dots";
        for (n = 0; n < list.length; n++) {
            sl = document.createElement("div");
            sl.className = "slide";
            sl.appendChild(makePhoto(list[n]));
            track.appendChild(sl);
            dot = document.createElement("button");
            dot.type = "button";
            dot.setAttribute("aria-label", (n + 1) + "번째 이미지 보기");
            dot.onclick = function () { go(btns.indexOf(this)); play(); };
            dots.appendChild(dot);
            btns.push(dot);
        }
        box.appendChild(track);
        box.appendChild(dots);

        function go(k) {
            now = (k + list.length) % list.length;
            track.style.transform = "translateX(" + (-now * 100) + "%)";
            for (var q = 0; q < btns.length; q++) btns[q].className = (q === now ? "on" : "");
            if (onMove) onMove(list[now]);
        }
        function stop() { if (timer) { clearInterval(timer); timer = null; } }
        function play() { stop(); timer = setInterval(function () { go(now + 1); }, SLIDE_TIME); }

        function hold(x) {
            if (box.dragging) return;
            startX = x;
            moved = 0;
            stop();
            track.className = "slide_track hold";
        }
        function drag(x) { if (startX !== null && !box.dragging) moved = x - startX; }
        function drop(keepStop) {
            if (startX === null) return;
            startX = null;
            track.className = "slide_track";
            if (box.dragging) return;
            if (moved > 40) go(now - 1);
            else if (moved < -40) go(now + 1);
            if (!keepStop) play();
        }
        box.addEventListener("touchstart", function (e) { touched = true; hold(e.touches[0].clientX); });
        box.addEventListener("touchmove", function (e) { drag(e.touches[0].clientX); });
        box.addEventListener("touchend", function () { drop(false); });
        box.addEventListener("mousedown", function (e) { if (touched) return; e.preventDefault(); hold(e.clientX); });
        box.addEventListener("mousemove", function (e) { if (touched) return; drag(e.clientX); });
        box.addEventListener("mouseup", function () { if (touched) return; drop(true); });
        box.addEventListener("mouseenter", function () { if (touched) return; stop(); });
        box.addEventListener("mouseleave", function () { if (touched) return; drop(true); play(); });
        box.addEventListener("click", function (e) {
            if (moved > 10 || moved < -10) { e.preventDefault(); moved = 0; }
        }, true);

        go(0);
        play();
    }

    /* 이미지 · 상품 정보 */
    for (i = 0; i < ITEMS.length; i++) {
        it = ITEMS[i];
        box = document.querySelector('[data-slot="' + it.slot + '"]');
        if (!box) continue;
        tip = null;
        if (it.slides) {
            if (it.slides[0].goods) tip = makeTip(box, it.slides[0]);
            makeSlider(box, it.slides, tip ? tip.set : null);
            for (j = 1; j < it.slides.length; j++) getPrice(it.slides[j].goods, noop);
        } else {
            box.insertBefore(makePhoto(it), box.firstChild);
            if (it.goods) tip = makeTip(box, it);
        }
        box.tipBox = tip;
        if (NO_FADE.indexOf(it.slot) < 0) box.className += " fade";
    }

    window.addEventListener("resize", function () {
        for (var k = 0; k < TIPS.length; k++) TIPS[k]();
    });

    /* 브랜드 버튼 */
    box = document.querySelector("#brand_section .brand_btn");
    if (box) newWin(box, BRAND_URL);

    /* 페이드 인 */
    function comeIn(el) {
        el.className += " is-in";
        if (el.tipBox) el.tipBox.auto();
    }
    var targets = document.querySelectorAll("#wrap_ey .fade");
    if (!window.IntersectionObserver) {
        for (i = 0; i < targets.length; i++) comeIn(targets[i]);
    } else {
        var io = new IntersectionObserver(function (entries, ob) {
            for (var k = 0; k < entries.length; k++) {
                if (!entries[k].isIntersecting) continue;
                comeIn(entries[k].target);
                ob.unobserve(entries[k].target);
            }
        }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
        for (i = 0; i < targets.length; i++) io.observe(targets[i]);
    }

    AOS.init({ once: true, duration: 900, easing: "ease-out-cubic" });
})();
</script>
