<script>
(function () {
    var IMG_PATH = 'https://cdn-tgreen.bizhost.kr/phpskr/tgreen09/2026/07/23/HSH/img/pd/';
    var SHOP_VIEW_PATH = '/shop/view.php?index_no=';

    var products = [
        { product: '688902', img: 'img_pd01.jpg' },
        { product: '688894', img: 'img_pd02.jpg' },
        { product: '688884', img: 'img_pd03.jpg' },
        { product: '688900', img: 'img_pd04.jpg' },
        { product: '688873', img: 'img_pd05.jpg' },
        { product: '688880', img: 'img_pd06.jpg' },
        { product: '688932', img: 'img_pd07.jpg' },
        { product: '688922', img: 'img_pd08.jpg' },
        { product: '689277', img: 'img_pd09.jpg' }
    ];

    var pdBox = document.getElementById('pdBox');
    var productNameCache = {};

    if (!pdBox) {
        return;
    }

    function findProductName(html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var selectors = [
            'meta[property="og:title"]',
            'meta[name="title"]',
            '.goods_name',
            '.goods_view .name',
            '.item_detail_tit h3',
            '.detail_info h1',
            'h1'
        ];

        for (var i = 0; i < selectors.length; i++) {
            var element = doc.querySelector(selectors[i]);
            var productName = '';

            if (!element) {
                continue;
            }

            productName = element.getAttribute('content') || element.textContent || '';
            productName = productName.replace(/\s+/g, ' ').trim();

            if (productName) {
                return productName;
            }
        }

        return '';
    }

    function setProductAlt(productNo, img, link) {
        var fallbackAlt = '상품번호 ' + productNo + ' 상품 이미지';

        img.alt = fallbackAlt;
        link.setAttribute('aria-label', fallbackAlt);

        if (productNameCache[productNo]) {
            img.alt = productNameCache[productNo];
            link.setAttribute('aria-label', productNameCache[productNo]);
            return;
        }

        fetch(SHOP_VIEW_PATH + encodeURIComponent(productNo), {
            credentials: 'same-origin'
        })
            .then(function (response) {
                if (!response.ok) {
                    throw new Error('상품 정보 조회 실패');
                }

                return response.text();
            })
            .then(function (html) {
                var productName = findProductName(html);

                if (!productName) {
                    return;
                }

                productNameCache[productNo] = productName;
                img.alt = productName;
                link.setAttribute('aria-label', productName);
            })
            .catch(function () {
                /* 실패하면 상품번호 기반 alt를 유지합니다. */
            });
    }

    var ul = document.createElement('ul');

    for (var i = 0; i < products.length; i++) {
        var productNo = products[i].product;
        var li = document.createElement('li');
        var a = document.createElement('a');
        var img = document.createElement('img');

        a.href = SHOP_VIEW_PATH + encodeURIComponent(productNo);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';

        img.src = IMG_PATH + products[i].img;
        setProductAlt(productNo, img, a);

        a.appendChild(img);
        li.appendChild(a);
        ul.appendChild(li);
    }

    pdBox.appendChild(ul);
}());
</script>
