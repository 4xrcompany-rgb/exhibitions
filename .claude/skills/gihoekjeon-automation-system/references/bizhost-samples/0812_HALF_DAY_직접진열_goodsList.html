<script>
    (() => {
      const hero = document.querySelector('.black-hero');
      if (!hero) return;

      const alignHalfDayTitle = () => {
        const inner = hero.querySelector('.black-hero__inner');
        const top = hero.querySelector('.hero-top');
        const bottom = hero.querySelector('.hero-bottom');
        const title = hero.querySelector('.hero-title');
        const rightLetter = hero.querySelector('.hero-letter--right');
        const day = hero.querySelector('.hero-day');
        if (!inner || !top || !bottom || !title || !rightLetter || !day) return;

        title.style.left = '0px';
        title.style.transform = 'none';
        day.style.left = '0px';

        const innerRect = inner.getBoundingClientRect();
        const topRect = top.getBoundingClientRect();
        const bottomRect = bottom.getBoundingClientRect();
        const titleWidth = title.offsetWidth;
        const dayWidth = day.offsetWidth;
        const rightLetterStart = rightLetter.offsetLeft;
        const combinedWidth = Math.max(titleWidth, rightLetterStart + dayWidth);
        const titleLeftInInner = (inner.clientWidth - combinedWidth) / 2;
        const topLeftInInner = topRect.left - innerRect.left;
        const bottomLeftInInner = bottomRect.left - innerRect.left;
        const titleLeftInTop = titleLeftInInner - topLeftInInner;
        const dayLeftInBottom = titleLeftInInner + rightLetterStart - bottomLeftInInner;

        title.style.left = `${titleLeftInTop}px`;
        day.style.left = `${dayLeftInBottom}px`;

      };

      let resizeFrame;
      const requestTitleAlignment = () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(alignHalfDayTitle);
      };

      window.addEventListener('resize', requestTitleAlignment, { passive: true });

      let heroStarted = false;
      const startHero = () => {
        if (heroStarted) return;
        heroStarted = true;
        requestTitleAlignment();
        requestAnimationFrame(() => {
          /* 초기 상태를 먼저 확정하고 다음 프레임에 애니메이션 선언을 생성합니다. */
          void hero.offsetWidth;
          requestAnimationFrame(() => {
            hero.classList.add('is-ready');
            try {
              hero.dispatchEvent(new Event('heroanimationstart'));
            } catch (error) {
              const startEvent = document.createEvent('Event');
              startEvent.initEvent('heroanimationstart', false, false);
              hero.dispatchEvent(startEvent);
            }
          });
        });
      };

      /* 외부 폰트 응답과 무관하게 즉시 시작합니다. 폰트가 바뀌면 정렬만 다시 계산합니다. */
      startHero();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(requestTitleAlignment, requestTitleAlignment);
      }

      /* iOS의 뒤로가기 캐시 및 화면 회전 후에도 정렬과 시작 상태를 복구합니다. */
      window.addEventListener('pageshow', (event) => {
        requestTitleAlignment();
        if (!hero.classList.contains('is-ready')) startHero();
      }, { passive: true });
      window.addEventListener('orientationchange', requestTitleAlignment, { passive: true });
    })();

    (() => {
      const titleSelector = '.discount_view .goods_list > div .tit_40, .discount_view .goods_list > div .txt_46';

      if (!('IntersectionObserver' in window)) {
        const restoreSaturation = () => {
          document.querySelectorAll(titleSelector).forEach((title) => title.classList.add('is-saturated'));
        };
        restoreSaturation();
        new MutationObserver(restoreSaturation).observe(document.body, { childList: true, subtree: true });
        return;
      }

      const saturationObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-saturated');
          observer.unobserve(entry.target);
        });
      }, {
        threshold: 0.2
      });

      const observeCategoryTitles = (root = document) => {
        if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;

        if (root.nodeType === Node.ELEMENT_NODE && root.matches(titleSelector)) {
          saturationObserver.observe(root);
        }
        root.querySelectorAll(titleSelector).forEach((title) => saturationObserver.observe(title));
      };

      observeCategoryTitles();

      new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => observeCategoryTitles(node));
        });
      }).observe(document.body, { childList: true, subtree: true });
    })();

    (() => {
      const content = document.querySelector('.content_box');
      if (!content) return;

      const isMobile = window.matchMedia('(max-width: 768px)').matches;
      const showContent = () => content.classList.add('is-visible');

      if (isMobile) {
        /* 모바일: 스크롤과 관계없이 메인 비주얼의 마지막 애니메이션 후 실행 */
        const finalHeroMotion = document.querySelector('.black-hero__inner .hero-side');
        if (!finalHeroMotion) {
          showContent();
          return;
        }

        let contentStarted = false;
        let contentFallback;
        const startAfterHero = (event) => {
          if (event && event.animationName && event.animationName !== 'side-show') return;
          if (contentStarted) return;
          contentStarted = true;
          clearTimeout(contentFallback);
          showContent();
        };
        finalHeroMotion.addEventListener('animationend', startAfterHero, { once: true });
        finalHeroMotion.addEventListener('webkitAnimationEnd', startAfterHero, { once: true });

        /* animationend가 누락되는 일부 iOS WebView에서도 마지막 모션 뒤 반드시 실행합니다. */
        const armContentFallback = () => {
          clearTimeout(contentFallback);
          contentFallback = setTimeout(startAfterHero, 3100);
        };
        const heroElement = document.querySelector('.black-hero');
        if (heroElement && heroElement.classList.contains('is-ready')) armContentFallback();
        else if (heroElement) heroElement.addEventListener('heroanimationstart', armContentFallback, { once: true });
        return;
      }

      /* PC: 기존처럼 content_box가 화면에 들어올 때 스크롤 애니메이션 실행 */
      if (!('IntersectionObserver' in window)) {
        showContent();
        return;
      }

      const contentObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          showContent();
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.25 });

      contentObserver.observe(content);
    })();
  </script>
