#visual_section .visual_title { font-size: 150px; font-weight: 800;  opacity: 0; letter-spacing: 0.42em; transform: translateY(12px); filter: blur(6px);
    animation: visualTitleSpacingIn 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
#visual_section .visual_sub_title { margin-top: 26px; font-size: 60px; font-weight: 400; opacity: 0; transform: translateY(28px); filter: blur(4px);
    animation: visualFadeUpIn 0.8s ease forwards; animation-delay: 1.0s; }
#visual_section .visual_desc { margin: 150px 0 0; font-size: 20px; font-weight: 300; line-height: 1.45em; }

@keyframes visualTitleSpacingIn {
    0% { opacity: 0; letter-spacing: 0.42em; transform: translateY(12px); filter: blur(6px); }
    100% { opacity: 1; letter-spacing: -0.04em; transform: translateY(0); filter: blur(0); }}

@keyframes visualFadeUpIn {
    0% { opacity: 0; transform: translateY(28px); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }}

@-webkit-keyframes visualTitleMaskRevealMo {
    0% { opacity: 0; -webkit-transform: translateY(115%); transform: translateY(115%); }
    100% { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }}

@keyframes visualTitleMaskRevealMo {
    0% { opacity: 0; -webkit-transform: translateY(115%); transform: translateY(115%); }

#pd_section .pd_img_link,

</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const imageBaseURL = 'https://cdn-tgreen.bizhost.kr/phpskr/tgreen09/2026/08/04/SOL/img/pd/';
    const goodsBaseURL = '/shop/view.php?index_no=';

    const eventConfig = {
        startDateLabel: '26.08.04 - 08.07',
        endDateKST: '2026-08-07T23:59:59+09:00'
    };

//',' 구분 켜기+끄기
    const priceFormatConfig = {
    use_comma: false
    };

//퍼센트 뱃지
    const discountBadgeImageURL = 'https://cdn-tgreen.bizhost.kr/phpskr/tgreen09/2026/08/04/SOL/img/pd/pd_discount_badge.png';
    const discountBadgeConfig = {
        pc_width: 180,
        mo_width: 195
    };

//상품 이미지
    const colorItem = (color_code, link) => ({ color_code, link });
    const stateItem = ({ number, name, original_price, img, name_color, original_price_color }) =>
    ({ number, name, original_price, img, name_color, original_price_color });

    const products = [
    { discount_price: '36680', discount: '44%', soldout: false,
        colors: [
            colorItem('#ccaf88', '/shop/view.php?index_no=687800'),
            colorItem('#000', '/shop/view.php?index_no=687799')
        ],
        default_state: stateItem({
            number: '687800', name: 'BC 로고나염 카펜더 팬츠 (BEIGE)', original_price: '65500', img: '/img_pd01_01.jpg', name_color: '#fff', original_price_color: '#fff' }),
        hover_state: stateItem({
            number: '687800', name: 'BC 로고나염 카펜더 팬츠 (BEIGE)', original_price: '65500', img: '/img_pd01_02.jpg', name_color: '#000', original_price_color: '#000' })
    },

    { discount_price: '33320', discount: '44%', soldout: false,
        colors: [
            colorItem('#3c4130', '/shop/view.php?index_no=688424'),
            colorItem('#000', '/shop/view.php?index_no=688425')
        ],
        default_state: stateItem({
            number: '688424', name: '더블니 밀리터리 와이드 팬츠 카키', original_price: '59500', img: '/img_pd02_01.jpg', name_color: '#fff', original_price_color: '#fff' }),
        hover_state: stateItem({
            number: '688424', name: '더블니 밀리터리 와이드 팬츠 카키', original_price: '59500', img: '/img_pd02_02.jpg', name_color: '#000', original_price_color: '#000' })
    },

    { discount_price: '26600', discount: '44%', soldout: false,
        colors: [
            colorItem('#91abcf', '/shop/view.php?index_no=684132'),
        ],
        default_state: stateItem({
            number: '684132', name: '워시드 스트레이트 데님팬츠', original_price: '47500', img: '/img_pd03_01.jpg', name_color: '#fff', original_price_color: '#fff' }),
        hover_state: stateItem({
            number: '684132', name: '워시드 스트레이트 데님팬츠', original_price: '47500', img: '/img_pd03_02.jpg', name_color: '#000', original_price_color: '#000' })
    },

    { discount_price: '29120', discount: '44%', soldout: false,
        colors: [
            colorItem('#696935', '/shop/view.php?index_no=687716'),
            colorItem('#b4b4b4', '/shop/view.php?index_no=687718'),
            colorItem('#101535', '/shop/view.php?index_no=687719')
        ],
        default_state: stateItem({
            number: '663277', name: 'AUBE 로고 스웻팬츠 올리브그린', original_price: '52000', img: '/img_pd04_01.jpg', name_color: '#fff', original_price_color: '#fff' }),
        hover_state: stateItem({
            number: '663277', name: 'AUBE 로고 스웻팬츠 올리브그린', original_price: '52000',  img: '/img_pd04_02.jpg', name_color: '#000', original_price_color: '#000' })
    }
];

//상품 정보 + 타이머
    const timerDate = document.getElementById('timer_date');
    const timerCount = document.getElementById('timer_count');
    const pdGrid = document.getElementById('pd_grid');

    timerDate.textContent = eventConfig.startDateLabel;

    function formatNumber(value) {
    const numberValue = Number(value);

    if (!priceFormatConfig.use_comma) {
        return String(numberValue);
    }

    return numberValue.toLocaleString('ko-KR');
    }

    function padNumber(value) {
        return String(value).padStart(2, '0');
    }

    function updateTimer() {
        const now = new Date();
        const end = new Date(eventConfig.endDateKST);
        const diff = end.getTime() - now.getTime();

        if (diff <= 0) {
            timerCount.textContent = '00 : 00 : 00 : 00';
            return;
        }

        const day = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hour = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const min = Math.floor((diff / (1000 * 60)) % 60);
        const sec = Math.floor((diff / 1000) % 60);

        timerCount.textContent = [
            padNumber(day),
            padNumber(hour),
            padNumber(min),
            padNumber(sec)
        ].join(' : ');
    }

    function getProductLink(number) {
        return goodsBaseURL + number;
    }

    function renderColors(colors) {
        if (!colors || !colors.length) return '';

        return colors.map(function (color) {
            return `
                <a href="${color.link}" target="_blank" rel="noopener noreferrer" class="pd_color_link">
                    <span class="pd_color_chip" style="background:${color.color_code};"></span>
                </a>
            `;
        }).join('');
    }

    function renderProducts() {
    if (!pdGrid) return;

    pdGrid.innerHTML = products.map(function (product, index) {
        const state = product.default_state;
        const productLink = getProductLink(state.number);
        const imageURL = imageBaseURL + state.img;

        return `
            <div class="pd_item ${product.soldout ? 'is-soldout' : ''}"
            data_product_index="${index}"
            style="--pd_discount_width:${discountBadgeConfig.pc_width}px; --pd_discount_width_mo:${discountBadgeConfig.mo_width}px;">
                <div class="pd_thumb">
                    <div class="pd_badge">
                        <h3 class="pd_badge_text">4TYPE 4DAY</h3>
                    </div>

                    <a href="${productLink}" target="_blank" rel="noopener noreferrer" class="pd_img_link">
                        <img src="${imageURL}" alt="${state.name}" class="pd_img">
                    </a>

                    ${product.soldout ? `
                        <div class="pd_soldout">
                            <h3 class="pd_soldout_text">SOLD OUT</h3>
                        </div>
                    ` : ''}

                    <div class="pd_info">
                        <div class="pd_info_left">
                            <div class="pd_price_box">
                                <h4 class="pd_origin_price" style="color:${state.original_price_color};">${formatNumber(state.original_price)}</h4>
                                <h2 class="pd_sale_price">${formatNumber(product.discount_price)}<span class="won">원</span></h2>
                            </div>
                            <h3 class="pd_name" style="color:${state.name_color};">${state.name}</h3>
                        </div>

                        <div class="pd_discount">
                            <img src="${discountBadgeImageURL}" alt="${product.discount} 할인" class="pd_discount_img">
                            <h3 class="pd_discount_text">${product.discount}</h3>
                        </div>
                    </div>
                </div>

                <div class="pd_meta">
                    <div class="pd_meta_left">
                        <div class="pd_color_row">
                            <h4 class="pd_color_title">COLOR</h4>
                            <div class="pd_color_list">
                                ${renderColors(product.colors)}
                            </div>
                        </div>
                    </div>

                    <h4 class="pd_move_text">색상 클릭 시 해당 상품 이동</h4>
                </div>
            </div>
        `;
    }).join('');

    bindProductHover();
    runMobileAutoPreview();
}

    updateTimer();
    setInterval(updateTimer, 1000);
    renderProducts();

    function applyProductState(pdItem, productState) {
    const imgLink = pdItem.querySelector('.pd_img_link');
    const img = pdItem.querySelector('.pd_img');
    const name = pdItem.querySelector('.pd_name');
    const originPrice = pdItem.querySelector('.pd_origin_price');

    if (imgLink) {
        imgLink.href = getProductLink(productState.number);
    }

    if (img) {
        img.src = imageBaseURL + productState.img;
        img.alt = productState.name;
    }

    if (name) {
        name.textContent = productState.name;
        name.style.color = productState.name_color || '';
    }

    if (originPrice) {
        originPrice.textContent = formatNumber(productState.original_price);
        originPrice.style.color = productState.original_price_color || '';
    }
}

function bindProductHover() {
    const pdItems = document.querySelectorAll('.pd_item');

    pdItems.forEach(function (pdItem) {
        const productIndex = Number(pdItem.getAttribute('data_product_index'));
        const product = products[productIndex];

        if (!product || !product.hover_state) return;

        let hoverTimer = null;
        let leaveTimer = null;

        pdItem.addEventListener('mouseenter', function () {
            if (window.innerWidth <= 768) return;

            clearTimeout(leaveTimer);

            hoverTimer = setTimeout(function () {
                pdItem.classList.add('is-switching');
                applyProductState(pdItem, product.hover_state);

                setTimeout(function () {
                    pdItem.classList.remove('is-switching');
                }, 220);
            }, 70);
        });

        pdItem.addEventListener('mouseleave', function () {
            if (window.innerWidth <= 768) return;

            clearTimeout(hoverTimer);

            leaveTimer = setTimeout(function () {
                pdItem.classList.add('is-switching');
                applyProductState(pdItem, product.default_state);

                setTimeout(function () {
                    pdItem.classList.remove('is-switching');
                }, 220);
            }, 40);
        });
    });
}

function runMobileAutoPreview() {
    if (window.innerWidth > 768) return;

    const pdItems = document.querySelectorAll('.pd_item');
    let isPreviewRunning = false;

    if (!('IntersectionObserver' in window)) {
        return;
    }

    const observer = new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            if (entry.intersectionRatio < 0.98) return;

            const pdItem = entry.target;

            if (pdItem.dataset.mobilePreviewPlayed === 'true') {
                obs.unobserve(pdItem);
                return;
            }

            if (isPreviewRunning) return;

            const productIndex = Number(pdItem.getAttribute('data_product_index'));
            const product = products[productIndex];

            if (!product || !product.hover_state) {
                obs.unobserve(pdItem);
                return;
            }

            isPreviewRunning = true;
            pdItem.dataset.mobilePreviewPlayed = 'true';

            setTimeout(function () {
                pdItem.classList.add('is-switching');
                applyProductState(pdItem, product.hover_state);

                setTimeout(function () {
                    applyProductState(pdItem, product.default_state);
                    pdItem.classList.remove('is-switching');
                    isPreviewRunning = false;
                }, 900);
            }, 250);

            obs.unobserve(pdItem);
        });
    }, {
        threshold: [0.98, 1]
    });

    pdItems.forEach(function (pdItem) {
        observer.observe(pdItem);
    });
}
});
</script>
