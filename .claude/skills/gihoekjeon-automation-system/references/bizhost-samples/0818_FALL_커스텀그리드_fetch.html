<script>
  (() => {
    const isPhone = /Android|iPhone|iPod|Mobile/i.test(navigator.userAgent);
    document.documentElement.classList.toggle('is-archive-mobile', isPhone);
  })();

  (() => {
    const hero = document.querySelector('.archive-hero');
    if (!hero) return;

    const mediaItems = [...hero.querySelectorAll('.archive-hero__media')];
    const scrollGuide = hero.querySelector('.archive-hero__scroll');
    const mobileMotionQuery = window.matchMedia('(max-width: 750px)');
    const MOBILE_SCROLL_SPEED = 1.8;
    let ticking = false;

    const updateArchiveMotion = () => {
      if (scrollGuide) {
        scrollGuide.classList.toggle('is-hidden', window.scrollY > 1);
      }
      const rect = hero.getBoundingClientRect();
      const scrollRange = Math.max(hero.offsetHeight - window.innerHeight, 1);
      const heroDocumentTop = rect.top + window.scrollY;
      const animationStart = Math.max(heroDocumentTop, 0);
      const rawProgress = Math.min(Math.max((window.scrollY - animationStart) / scrollRange, 0), 1);
      const isMobileMotion = mobileMotionQuery.matches || document.documentElement.classList.contains('is-archive-mobile');
      const scrollSpeed = isMobileMotion ? MOBILE_SCROLL_SPEED : 1;
      const progress = Math.min(rawProgress * scrollSpeed, 1);
      const outwardProgress = 1 - progress;
      mediaItems.forEach((item) => {
        const style = getComputedStyle(item);
        const moveX = parseFloat(style.getPropertyValue('--move-x')) || 0;
        const moveY = parseFloat(style.getPropertyValue('--move-y')) || 0;
        item.style.transform = `translate3d(${moveX * outwardProgress}px,${moveY * outwardProgress}px,0)`;
        item.style.opacity = String(Math.min(progress * 1.5, 1));
      });
      ticking = false;
    };

    const requestArchiveMotion = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(updateArchiveMotion);
    };

    updateArchiveMotion();
    window.addEventListener('scroll', requestArchiveMotion, {passive:true});
    window.addEventListener('resize', requestArchiveMotion, {passive:true});
    window.addEventListener('orientationchange', requestArchiveMotion, {passive:true});
    window.addEventListener('pageshow', requestArchiveMotion, {passive:true});
  })();

  (() => {
    // 브랜드 배너 공통 이미지 경로입니다. 각 배너는 아래 bannerFileName만 변경하세요.
    const archiveBrandBannerPath = 'https://cdn-tgreen.bizhost.kr/phpskr/tgreen09/2026/08/18/KEY/fall/img/cate/';
    const groups = [
      {id:'archive-rugged-house', label:'러기드하우스 베스트', bannerFileName:'img_cate01.jpg', productNos:[689212,689097,689095,689092,689090,689088,688958,688939,688690,688686,688659,688553,688544,688519]},
      {id:'archive-burning-capone', label:'버닝카포네 베스트', bannerFileName:'img_cate02.jpg', productNos:[688312,687950,687875,687873,687808,687801,687800,687798,687793,687316,684098,674082,668777,668724]},
      {id:'archive-airit', label:'에어릿 70%', bannerFileName:'img_cate03.jpg', productNos:[671469,657263,657262,656481,655012,654808,654807,654450,654449]},
      {id:'archive-mozmoz', label:'모즈모즈 만원', bannerFileName:'img_cate04.jpg', productNos:[627001,623722,623721,623719,623718,623717,623716,615641,615640,615637]}
    ];
    const root = document.querySelector('#archive-product-groups');
    if (!root) return;

    const productCard = (group, productNo) => `
      <article class="archive-product-card" data-goods-no="${productNo}">
        <a class="archive-product-card__link" href="/shop/view.php?index_no=${productNo}" target="_blank" rel="noopener noreferrer" aria-label="${group.label} 상품 ${productNo}"></a>
        <div class="archive-product-card__image">
          <span class="archive-product-card__loading">loading</span>
          <img src="" alt="" hidden>
        </div>
        <a class="archive-product-card__brand" href="#" target="_blank" rel="noopener noreferrer">상품번호 ${productNo}</a>
        <p class="archive-product-card__name">상품 정보를 불러오는 중입니다.</p>
        <div class="archive-product-card__meta">
          <strong class="archive-product-card__price" data-field="sale-price"></strong>
          <del class="archive-product-card__original" data-field="original-price" hidden></del>
          <span class="archive-product-card__discount" data-field="discount-rate" hidden></span>
          <span class="archive-product-card__review" data-field="review-count"></span>
        </div>
      </article>`;

    root.innerHTML = groups.map((group) => `
      <section class="archive-product-group" id="${group.id}" aria-label="${group.label}">
        <div class="archive-brand-banner">
          <img src="${archiveBrandBannerPath}${group.bannerFileName}" alt="${group.label} 브랜드 배너" loading="lazy">
        </div>
        <div class="archive-product-grid">${group.productNos.map((productNo) => productCard(group, productNo)).join('')}</div>
      </section>`).join('');

    const won = (value) => {
      const number = Number(String(value || '').replace(/[^0-9]/g, ''));
      return number ? `${number.toLocaleString('ko-KR')}원` : '';
    };

    const isMobileGoodsView = () => window.matchMedia('(max-width: 749px)').matches
      || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

    const readGoodsPage = async (productNo) => {
      const url = `/shop/view.php?index_no=${productNo}`;
      const response = await fetch(url, {credentials:'same-origin'});
      if (!response.ok) throw new Error(`상품 ${productNo} 조회 실패`);

      const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
      const meta = (property) => doc.querySelector(`meta[property="${property}"]`)?.content?.trim() || '';
      const originalText = doc.querySelector('.price_01 span')?.textContent?.trim() || '';
      const discountText = doc.querySelector('.price_02 .sale')?.textContent?.trim() || '';
      const original = Number(originalText.replace(/[^0-9]/g, '')) || 0;
      const sale = Number(meta('product:sale_price:amount')) || original;
      const reviewSelectors = [
        ...(isMobileGoodsView() ? ['.btn_review .count_ey'] : []),
        '.review_new_wrap .tit_24 strong',
        '.detail_top .review strong',
        '.review_count',
        '.review-count',
        '.prd_review_count',
        '[data-review-count]',
        'a[href*="review"] .count',
        'a[href*="review"] strong'
      ];
      const reviewElement = reviewSelectors
        .map((selector) => doc.querySelector(selector))
        .find((element) => element && /\d/.test(element.getAttribute('data-review-count') || element.textContent || ''));
      const reviewValue = reviewElement
        ? (reviewElement.getAttribute('data-review-count') || reviewElement.textContent || '')
        : '';
      const pageSource = doc.documentElement.innerHTML;
      const reviewSourceMatch = pageSource.match(/(?:reviewCount|review_count|reviewCnt|review_cnt|goodsReviewCount)["']?\s*[:=]\s*["']?([0-9,]+)/i);
      const reviewCount = Number(String(reviewValue || reviewSourceMatch?.[1] || '0').replace(/[^0-9]/g, '')) || 0;
      const brandLink = doc.querySelector('.prd_brand a[href], .brand_name a[href], .goods_info a[href*="brand"], a[href*="brand="]');

      return {
        url,
        image: meta('og:image'),
        brand: meta('product:brand'),
        brandUrl: brandLink?.getAttribute('href') || '',
        name: meta('og:title').replace(/\s*-\s*4XR\s*$/i, ''),
        price: won(sale),
        originalPrice: originalText || (original > sale ? won(original) : ''),
        discount: discountText || (original > sale ? `${Math.round((1 - sale / original) * 100)}%` : ''),
        reviewCount
      };
    };

    const renderGoods = async (card) => {
      try {
        const productNo = card.dataset.goodsNo;
        const goods = isMobileGoodsView()
          ? await readGoodsPage(productNo)
          : (typeof window.getArchiveGoods === 'function'
            ? await window.getArchiveGoods(productNo)
            : await readGoodsPage(productNo));
        if (!goods) throw new Error(`상품 ${productNo} 데이터 없음`);

        const link = card.querySelector('.archive-product-card__link');
        const imageWrap = card.querySelector('.archive-product-card__image');
        const image = imageWrap.querySelector('img');
        const loading = card.querySelector('.archive-product-card__loading');
        link.href = goods.url || `/shop/view.php?index_no=${productNo}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        if (goods.image) {
          const showThumbnail = () => {
            image.hidden = false;
            loading.hidden = true;
            imageWrap.classList.add('is-loaded');
          };
          image.addEventListener('load', showThumbnail, {once:true});
          image.addEventListener('error', () => {
            loading.textContent = '상품 이미지 없음';
          }, {once:true});
          image.src = goods.image;
          image.alt = goods.name || `상품 ${productNo}`;
          if (image.complete && image.naturalWidth) showThumbnail();
        } else {
          loading.textContent = '상품 이미지 없음';
        }
        const brand = card.querySelector('.archive-product-card__brand');
        brand.textContent = goods.brand || '';
        brand.href = goods.brandUrl || goods.brandLink || '#';
        brand.style.pointerEvents = (goods.brandUrl || goods.brandLink) ? '' : 'none';
        card.querySelector('.archive-product-card__name').textContent = goods.name || '';
        const salePrice = goods.price || goods.salePrice || '';
        const originalPrice = goods.originalPrice || goods.original || '';
        const discountRate = goods.discount || goods.discountRate || goods.sale || '';
        card.querySelector('[data-field="sale-price"]').textContent = salePrice;
        const original = card.querySelector('[data-field="original-price"]');
        const discount = card.querySelector('[data-field="discount-rate"]');
        original.textContent = originalPrice;
        original.hidden = !originalPrice;
        discount.textContent = discountRate;
        discount.hidden = !discountRate;
        const reviewRaw = goods.reviewCount
          ?? goods.review_count
          ?? goods.reviewCnt
          ?? goods.review_cnt
          ?? goods.goodsReviewCount
          ?? goods.review
          ?? 0;
        const reviewCount = Number(String(reviewRaw).replace(/[^0-9]/g, '')) || 0;
        const review = card.querySelector('[data-field="review-count"]');
        if (reviewCount > 0) {
          review.textContent = `(${reviewCount.toLocaleString('ko-KR')})`;
          review.classList.add('is-visible');
        } else {
          review.textContent = '';
          review.classList.remove('is-visible');
        }
      } catch (error) {
        card.querySelector('.archive-product-card__loading').textContent = '상품 정보 없음';
        card.querySelector('.archive-product-card__name').textContent = '상품 정보를 확인해 주세요.';
      }
    };

    const cards = [...root.querySelectorAll('[data-goods-no]')];
    const loadInBatches = async () => {
      for (let i = 0; i < cards.length; i += 6) {
        await Promise.all(cards.slice(i, i + 6).map(renderGoods));
      }
    };
    loadInBatches();
  })();

  (() => {
    const nav = document.querySelector('.archive-content__nav');
    if (!nav) return;

    const links = [...nav.querySelectorAll('a[href^="#"]')];
    const sections = links.map((link) => document.querySelector(link.getAttribute('href')));
    if (!links.length || sections.some((section) => !section)) return;

    let scrollTicking = false;

    const activateMenu = (activeLink, moveIntoView = false) => {
      links.forEach((link) => {
        const isActive = link === activeLink;
        link.classList.toggle('is-active', isActive);
        if (isActive) link.setAttribute('aria-current', 'true');
        else link.removeAttribute('aria-current');
      });

      if (moveIntoView) {
        const scrollBox = nav.querySelector('.archive-content__nav-scroll');
        const targetLeft = activeLink.offsetLeft - (scrollBox.clientWidth - activeLink.offsetWidth) / 2;
        scrollBox.scrollTo({left:Math.max(targetLeft, 0), behavior:'smooth'});
      }
    };

    const getNavHeight = () => nav.getBoundingClientRect().height;

    const scrollToSection = (section) => {
      const top = window.pageYOffset + section.getBoundingClientRect().top - getNavHeight() - 12;
      window.scrollTo({top:Math.max(top, 0), behavior:'smooth'});
    };

    links.forEach((link, index) => {
      link.addEventListener('click', (event) => {
        event.preventDefault();
        activateMenu(link, true);
        scrollToSection(sections[index]);

        if (history.replaceState) history.replaceState(null, '', link.getAttribute('href'));
      });
    });

    const updateActiveMenu = () => {
      const marker = window.pageYOffset + getNavHeight() + 24;
      let activeIndex = 0;

      sections.forEach((section, index) => {
        const sectionTop = window.pageYOffset + section.getBoundingClientRect().top;
        if (sectionTop <= marker) activeIndex = index;
      });

      activateMenu(links[activeIndex], true);
      scrollTicking = false;
    };

    const requestActiveMenuUpdate = () => {
      if (scrollTicking) return;
      scrollTicking = true;
      requestAnimationFrame(updateActiveMenu);
    };

    window.addEventListener('scroll', requestActiveMenuUpdate, {passive:true});
    window.addEventListener('resize', requestActiveMenuUpdate, {passive:true});

    const initialIndex = links.findIndex((link) => link.getAttribute('href') === location.hash);
    if (initialIndex >= 0) {
      requestAnimationFrame(() => {
        activateMenu(links[initialIndex], true);
        scrollToSection(sections[initialIndex]);
      });
    } else {
      updateActiveMenu();
    }
  })();

  (() => {
    const titleSelector = '.discount_view .goods_list > div .tit_40, .discount_view .goods_list > div .txt_46';

    if (!('IntersectionObserver' in window)) {
      const restoreSaturation = () => document.querySelectorAll(titleSelector).forEach((title) => title.classList.add('is-saturated'));
      restoreSaturation();
      new MutationObserver(restoreSaturation).observe(document.body, {childList:true,subtree:true});
      return;
    }

    const saturationObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-saturated');
        observer.unobserve(entry.target);
      });
    }, {threshold:.2});

    const observeCategoryTitles = (root = document) => {
      if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;
      if (root.nodeType === Node.ELEMENT_NODE && root.matches(titleSelector)) saturationObserver.observe(root);
      root.querySelectorAll(titleSelector).forEach((title) => saturationObserver.observe(title));
    };

    observeCategoryTitles();
    new MutationObserver((mutations) => {
      mutations.forEach((mutation) => mutation.addedNodes.forEach((node) => observeCategoryTitles(node)));
    }).observe(document.body, {childList:true,subtree:true});
  })();
</script>
